name: Image bauen und veröffentlichen

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhaengigkeiten
        run: pip install -r requirements.txt httpx esprima

      # Gegen die Fassung, die in DESKTOP_VERSION steht - also genau gegen das,
      # was auch ins Image kommt.
      - name: Tests
        run: |
          tools/desktop_holen.sh
          python tests/test_gleich.py
          python tests/test_server.py
          python tests/test_zerren.py
          python tests/test_glaetten.py
          python tests/test_balken.py
          python tests/test_post.py

  bauen:
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Zwei Nummern, zwei Zwecke: die Serverfassung taggt das Image, die
      # Desktop-Fassung sagt nur, welche Oberflaeche darin steckt. Vorher
      # trugen die Images die Desktop-Nummer - damit gab es ghcr-Tags wie
      # :1.1.84 fuer voellig verschiedene Serverstaende, und ein "zurueck auf
      # die vorige Fassung" war gar nicht moeglich.
      - name: Fassungen lesen
        id: f
        run: |
          echo "server=$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "desktop=$(tr -d ' \n' < DESKTOP_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Erst oertlich bauen, pruefen, DANN hochladen. Vorher stand das Image
      # schon als :latest in der Registry, waehrend die Startproben noch liefen -
      # ein Image, das gar nicht hochkommt, war damit bereits das, was ein
      # "docker compose pull" geholt haette. Von Hand faellt das auf; sobald
      # etwas automatisch zieht, nicht mehr.
      - name: Bauen (noch nicht schieben)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/lucywolf/notizmappe-server:${{ steps.f.outputs.server }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nicht nur bauen: einmal starten und nachsehen, ob der Server hochkommt
      # und die Einrichtungsseite liefert. Ein Image, das nur baut, nuetzt nichts.
      - name: Probe am fertigen Image
        run: |
          docker run -d --name probe -p 8112:8000 \
            ghcr.io/lucywolf/notizmappe-server:${{ steps.f.outputs.server }}
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8112/anmelden || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "Anmeldeseite: HTTP $code"
          [ "$code" = "200" ] || { docker logs probe; exit 1; }
          curl -s http://127.0.0.1:8112/anmelden | grep -q "einrichten" \
            || { echo "Keine Einrichtungsseite"; docker logs probe; exit 1; }
          curl -s -o /dev/null -w "stil.css: %{http_code}\n" http://127.0.0.1:8112/stil.css
          docker rm -f probe

      # Der Fall aus dem echten Leben: ./daten liegt auf der Platte und gehoert
      # einem Benutzer, nicht root. Passen die Rechte nicht, kommt die Seite
      # trotzdem hoch - nur gespeichert wird stumm nichts. Genau das ist beim
      # ersten Probelauf passiert, deshalb steht es hier.
      - name: Probe mit gemountetem Ordner
        run: |
          mkdir -p /tmp/daten
          docker run -d --name probe2 -p 8112:8000 -v /tmp/daten:/daten \
            ghcr.io/lucywolf/notizmappe-server:${{ steps.f.outputs.server }}
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8112/anmelden || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { docker logs probe2; exit 1; }
          docker logs probe2 2>&1 | grep '\[start\]'

          curl -s -c /tmp/keks -o /dev/null -X POST \
            -d "name=probe&passwort=probepasswort&passwort2=probepasswort" \
            http://127.0.0.1:8112/einrichten
          [ -f /tmp/daten/benutzer.json ] \
            || { echo "Die Benutzerdatei wurde nicht angelegt - Rechte am Datenordner"; docker logs probe2; exit 1; }
          echo "Benutzerdatei: angelegt, gehoert $(stat -c '%u:%g' /tmp/daten/benutzer.json)"

          angemeldet=$(curl -s -b /tmp/keks -o /dev/null -w '%{http_code}' http://127.0.0.1:8112/)
          [ "$angemeldet" = "200" ] || { echo "Anmeldung haelt nicht ($angemeldet)"; exit 1; }
          baum=$(curl -s -b /tmp/keks -X POST -H 'X-Notizmappe: 1' \
                   -H 'Content-Type: application/json' -d '{"args":[]}' \
                   http://127.0.0.1:8112/bruecke/baum)
          echo "Baum: $baum"
          case "$baum" in *notizbuecher*) ;; *) echo "Kein Baum"; exit 1;; esac

          # Und der Serverprozess darf nicht als root laufen.
          uid=$(docker exec probe2 awk '/^Uid:/{print $2}' /proc/1/status)
          echo "Serverprozess laeuft als Uid $uid"
          [ "$uid" != "0" ] || { echo "Laeuft als root - start.py hat die Rechte nicht abgelegt"; exit 1; }
          docker rm -f probe2

      # Beide Proben gruen - jetzt erst darf es :latest werden. Gebaut wird
      # nicht neu, das kommt vollstaendig aus dem Cache von oben.
      - name: Schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lucywolf/notizmappe-server:latest
            ghcr.io/lucywolf/notizmappe-server:${{ steps.f.outputs.server }}
          cache-from: type=gha
