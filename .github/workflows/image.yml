name: Image bauen und veröffentlichen

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhaengigkeiten
        run: pip install -r requirements.txt httpx

      # Gegen die Fassung, die in DESKTOP_VERSION steht - also genau gegen das,
      # was auch ins Image kommt.
      - name: Tests
        run: |
          tools/desktop_holen.sh
          python tests/test_gleich.py
          python tests/test_server.py

  bauen:
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fassung lesen
        id: f
        run: echo "desktop=$(tr -d ' \n' < DESKTOP_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lucywolf/notizmappe-server:latest
            ghcr.io/lucywolf/notizmappe-server:${{ steps.f.outputs.desktop }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nicht nur bauen: einmal starten und nachsehen, ob der Server hochkommt
      # und die Einrichtungsseite liefert. Ein Image, das nur baut, nuetzt nichts.
      - name: Probe am fertigen Image
        run: |
          docker run -d --name probe -p 8112:8000 \
            ghcr.io/lucywolf/notizmappe-server:${{ steps.f.outputs.desktop }}
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8112/anmelden || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "Anmeldeseite: HTTP $code"
          [ "$code" = "200" ] || { docker logs probe; exit 1; }
          curl -s http://127.0.0.1:8112/anmelden | grep -q "einrichten" \
            || { echo "Keine Einrichtungsseite"; docker logs probe; exit 1; }
          curl -s -o /dev/null -w "stil.css: %{http_code}\n" http://127.0.0.1:8112/stil.css
          docker rm -f probe
