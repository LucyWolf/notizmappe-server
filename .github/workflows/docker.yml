# Baut bei jedem Tag v* das Server-Image und legt es nach
#   ghcr.io/<besitzer>/notizmappe-server:<version>  und  :latest
# Beim allerersten Mal ist das Paket auf GitHub privat - unter
# Packages -> notizmappe-server -> Package settings auf "Public" stellen, damit
# docker pull ohne Anmeldung geht.
name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install -r requirements.txt httpx
          PY=python ./tests/alle.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # metadata-action schreibt den Besitzer klein - ghcr nimmt keine Grossbuchstaben.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/notizmappe-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: notizmappe-server:probe
          labels: ${{ steps.meta.outputs.labels }}

      # Das Image einmal wirklich starten: "baut" heisst nicht "laeuft". Ohne Konto
      # muss es den Einrichtungscode ins Protokoll schreiben und auf 8099 antworten.
      - name: Image zur Probe starten
        run: |
          docker run -d --name probe -p 8099:8099 notizmappe-server:probe
          for i in $(seq 30); do
            curl -sf -o /dev/null http://127.0.0.1:8099/api/status && break
            sleep 2
          done
          echo "--- Protokoll ---"; docker logs probe
          curl -sf http://127.0.0.1:8099/api/status | tee /dev/stderr | grep -q '"server":true' \
            || { echo "::error::Der Container antwortet nicht im Server-Betrieb"; exit 1; }
          docker logs probe 2>&1 | grep -qi "Einrichtungscode" \
            || { echo "::error::Kein Einrichtungscode im Protokoll - das erste Konto kaeme nie zustande"; exit 1; }
          curl -s -o /dev/null -w "Startseite ohne Anmeldung: %{http_code}\n" -L http://127.0.0.1:8099/
          docker rm -f probe

      - name: Veroeffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
