# Starten:  docker compose up -d
# Danach:   http://<rechner>:8112  -> beim ersten Mal die Einrichtungsseite
#
# Alles, was bleiben muss, liegt in ./daten:
#   daten/benutzer.json        Zugaenge (Passwoerter als scrypt-Hash)
#   daten/notizen/<benutzer>/  die Notizen, als Dateien wie am Desktop
#   daten/konfig/<benutzer>/   Schriftfavoriten usw. je Benutzer
services:
  notizmappe:
    image: ghcr.io/lucywolf/notizmappe-server:latest
    # Selbst bauen statt ziehen:
    # build: .
    container_name: notizmappe
    restart: unless-stopped
    ports:
      - "8112:8000"
    volumes:
      # Wo die Notizen liegen. Standard ist ./daten daneben; fuer eine NAS, die
      # auf diesem Rechner schon eingehaengt ist, genuegt eine Zeile in .env:
      #     NOTIZMAPPE_ABLAGE=/mnt/nas/notizmappe
      # Soll Docker die Freigabe selbst einhaengen, siehe
      # docker-compose.override.yml.beispiel.
      - ${NOTIZMAPPE_ABLAGE:-./daten}:/daten
      # Die Einrichtung liegt getrennt von den Notizen - sonst waere sie
      # verschwunden, sobald eine Freigabe ueber /daten gehaengt wird.
      - ./einrichtung:/einrichtung
    environment:
      # Auf 1, wenn ein Proxy mit Zertifikat davorsteht (nginx, Caddy). Dann
      # bekommt der Sitzungs-Keks "Secure" und geht nur noch ueber HTTPS.
      # Im eigenen Netz ohne Zertifikat muss das 0 bleiben, sonst wirft der
      # Browser den Keks weg und niemand kann sich anmelden.
      NOTIZMAPPE_HTTPS: "0"
      # Nur noetig, wenn die Rechte am Ordner ./daten nicht passen. Ohne Angabe
      # richtet sich der Server nach dem Eigentuemer des Ordners.
      # PUID: "1000"
      # PGID: "1000"

    # Damit der Server eine NAS-Freigabe EINHAENGEN darf, die in der
    # Oberflaeche eingestellt wurde. Ohne das laesst sich dort alles eintragen,
    # nur passieren tut nichts - und die Oberflaeche sagt das auch.
    #
    # Was man damit aufgibt, ehrlich gesagt: SYS_ADMIN erlaubt Mounts im
    # Container, und das ist ein ordentlicher Hebel - weniger als der
    # Docker-Socket (der waere direkt root auf diesem Rechner), aber mehr als
    # nichts. Wer das nicht will, haengt die Freigabe stattdessen auf dem
    # Rechner ein und zeigt mit NOTIZMAPPE_ABLAGE darauf; dann bleibt der
    # Container so unbeteiligt wie bisher.
    # cap_add:
    #   - SYS_ADMIN

# ---------------------------------------------------------------------------
# NAS als Ablage
#
# Zwei Wege, beide ohne Sonderrechte fuer den Container:
#
#   1. Die Freigabe ist auf diesem Rechner schon eingehaengt (fstab, systemd):
#      eine Zeile in .env genuegt -> NOTIZMAPPE_ABLAGE=/mnt/nas/notizmappe
#
#   2. Docker soll sie selbst einhaengen: docker-compose.override.yml.beispiel
#      kopieren nach docker-compose.override.yml und ausfuellen. Compose liest
#      sie von allein dazu, und sie steht in .gitignore - deshalb gehoeren die
#      Zugangsdaten dorthin und nicht in diese Datei hier, die im Repo liegt.
#
# Bei SMB sind file_mode=0600,dir_mode=0700 Pflicht: dort bestimmen die
# Mount-Optionen die Rechte, chmod im Programm laeuft ins Leere. Der Start sagt
# es im Protokoll, wenn sie fehlen.
#
# Nur EIN Server pro Freigabe: die Sperre im Code gilt im Prozess, nicht ueber
# das Netz. Zwei Container auf derselben Ablage zerschiessen sich Dateien.
#
# FTP geht hierfuer nicht - kein atomares Umbenennen, keine Dateisperren. Ein
# Abbruch mitten im Speichern hinterlaesst eine halbe Seite statt der alten.
# ---------------------------------------------------------------------------
